<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plínio Ângelo Ferreira | Portfólio</title>
  <meta name="description"
    content="Portfólio de Plínio Ângelo Ferreira, estudante de Engenharia de Software: projetos, experiências e contato." />
  <script>
    (function () {
      var salvo = localStorage.getItem('tema')
      var escuro = salvo
        ? salvo === 'escuro'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.setAttribute(
        'data-theme',
        escuro ? 'escuro' : 'claro',
      )
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
